services:
  # Orthanc DICOM Archive / DICOMweb Server

  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: medvision-orthanc
    restart: unless-stopped

    ports:
      - "8042:8042"
      - "4242:4242"

    volumes:
      - medvision-orthanc-data:/var/lib/orthanc/db
      - ./dicom/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro

    networks:
      - backend_default

  # OHIF DICOM Browser Viewer
  ohif:
    image: ohif/app:latest
    container_name: medvision-ohif
    restart: unless-stopped

    depends_on:
      - orthanc

    ports:
      - "3001:80"

    volumes:
      - ./dicom/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./dicom/ohif/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - backend_default

  
 # Database mysql
  mysql:
    image: mysql:8.0
    container_name: medvision-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Thando3376!
      MYSQL_DATABASE: medvision

    ports:
      - "3306:3306"

    volumes:
      - medvision-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pThando3376!"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medvision-network

# Redis 
  redis:
    image: redis:7-alpine
    container_name: medvision-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medvision-network

#node backend
  node-backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medvision-node-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: Thando3376!
      MYSQL_DATABASE: medvision
      REDIS_URL: redis://redis:6379/0
      INFERENCE_SERVICE_URL: http://inference-api:8000
      FRONTEND_ORIGIN: http://localhost:3000

    ports:
      - "5000:5000"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference-api:
        condition: service_started

    networks:
      - medvision-network
    

  inference-api:
    build:
      context: ./inference-service
      dockerfile: Dockerfile

    container_name: medvision-inference-api
    restart: unless-stopped

    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: Thando3376!
      MYSQL_HOST: mysql
      MYSQL_DATABASE: medvision
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - medvision-network

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  inference-worker:
    build:
      context: ./inference-service
      dockerfile: Dockerfile

    container_name: medvision-inference-worker
    restart: unless-stopped

    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: Thando3376!
      MYSQL_HOST: mysql
      MYSQL_DATABASE: medvision
      REDIS_URL: redis://redis:6379/0

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - medvision-network

    command:
      [
        "celery",
        "-A",
        "tasks",
        "worker",
        "--loglevel=info",
        "-Q",
        "main_queue",
        "--pool=solo"
      ]

volumes:
  medvision-mysql-data:

networks:
  medvision-network:
    driver: bridge